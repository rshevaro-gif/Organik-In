<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Petani - OrganikIn</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#f5fff0,#dcfce7);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .register-container{
      width:100%;
      max-width:1100px;
      min-height:90vh;
      background:white;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.1);

      display:flex;
    }

    /* LEFT */
    .left{
      width:40%;
      background:linear-gradient(135deg,#84cc16,#65a30d);
      color:white;
      padding:50px;
      position:relative;

      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .badge{
      position:absolute;
      top:30px;
      right:30px;

      background:rgba(255,255,255,0.2);
      padding:10px 18px;

      border-radius:999px;

      font-size:14px;
      font-weight:600;

      backdrop-filter:blur(10px);
    }

    .left h1{
      font-size:54px;
      line-height:1.1;
      margin-bottom:20px;
    }

    .left p{
      font-size:18px;
      line-height:1.8;
      opacity:0.95;
    }

    /* RIGHT */
    .right{
      width:60%;
      padding:50px;
      overflow-y:auto;
      background:#fafafa;
    }

    .right h2{
      color:#65a30d;
      font-size:40px;
      margin-bottom:10px;
    }

    .desc{
      color:#64748b;
      margin-bottom:35px;
    }

    /* FORM */
    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .input-group{
      position:relative;
    }

    .full{
      grid-column:1/3;
    }

    .input-field{
      width:100%;
      height:56px;

      border:2px solid #e5e7eb;
      border-radius:16px;

      padding:0 18px 0 50px;

      font-size:15px;

      outline:none;
      transition:0.3s;
      background:white;
    }

    .input-field:focus{
      border-color:#84cc16;
      box-shadow:0 0 0 4px rgba(132,204,22,0.1);
    }

    .icon{
      position:absolute;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      color:#94a3b8;
      font-size:18px;
    }

    select{
      appearance:none;
      cursor:pointer;
    }

    /* BUTTON */
    .register-btn{
      width:100%;
      height:58px;

      border:none;
      border-radius:18px;

      background:linear-gradient(135deg,#f59e0b,#fbbf24);

      color:white;
      font-size:18px;
      font-weight:700;

      margin-top:28px;

      cursor:pointer;
      transition:0.35s;
    }

    .register-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 25px rgba(245,158,11,0.3);
    }

    .register-btn.active{
      background:linear-gradient(135deg,#16b364,#15803d);
    }

    /* LOGIN */
    .login-text{
      text-align:center;
      margin-top:22px;
      color:#64748b;
    }

    .login-text span{
      color:#65a30d;
      font-weight:700;
      cursor:pointer;
    }

    /* MOBILE */
    @media(max-width:900px){

      .register-container{
        flex-direction:column;
      }

      .left,
      .right{
        width:100%;
      }

      .left{
        padding:40px 30px;
      }

      .left h1{
        font-size:42px;
      }

      .right{
        padding:35px 25px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

    }

  </style>
</head>
<body>

  <div class="register-container">

    <!-- LEFT -->
    <div class="left">

      <div class="badge">
        🛒 Petani
      </div>

      <h1>Bergabung Bersama OrganikIn</h1>

      <p>
        Dapatkan pupuk organik, kompos, dan produk hasil daur ulang limbah dengan mudah dan terjangkau.
      </p>

    </div>

    <!-- RIGHT -->
    <div class="right">

      <h2>Daftar Akun</h2>

      <p class="desc">
        Lengkapi data berikut untuk membuat akun Petani
      </p>

      <div class="form-grid">

        <!-- NAMA -->
        <div class="input-group">
          <input type="text" class="input-field" placeholder="Nama Lengkap">
          <i class="fas fa-user icon"></i>
        </div>

        <!-- HP -->
        <div class="input-group">
          <input type="tel" class="input-field" placeholder="Nomor HP">
          <i class="fas fa-phone icon"></i>
        </div>

        <!-- EMAIL -->
        <div class="input-group">
          <input type="email" class="input-field" placeholder="Email">
          <i class="fas fa-envelope icon"></i>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <input type="password" class="input-field" placeholder="Password">
          <i class="fas fa-lock icon"></i>
        </div>

        <!-- ALAMAT -->
        <div class="input-group full">
          <input type="text" class="input-field" placeholder="Alamat Lengkap">
          <i class="fas fa-location-dot icon"></i>
        </div>


        <!-- KEBUTUHAN -->
        <div class="input-group">
          <select class="input-field">

            <option value="">
              Produk yang Dibutuhkan
            </option>

            <option>
              Pupuk organik
            </option>

            <option>
              Pupuk Organik Cair
            </option>

          </select>

          <i class="fas fa-cart-shopping icon"></i>
        </div>

      </div>

      <!-- BUTTON -->
      <button class="register-btn" onclick="registerPembeli()">
        Daftar Sekarang
      </button>

      <!-- LOGIN -->
      <div class="login-text">

        Sudah punya akun?

        <span onclick="goLogin()">
          Masuk
        </span>

      </div>

    </div>

  </div>

  <script>

    function registerPembeli(){

      const inputs = document.querySelectorAll('.input-field');

      const btn = document.querySelector('.register-btn');

      let valid = true;

      inputs.forEach(input => {

        if(input.value === ''){

          valid = false;

        }

      });

      if(!valid){

        alert('⚠️ Lengkapi semua data terlebih dahulu');

        return;

      }

      // UBAH WARNA BUTTON
      btn.classList.add('active');

      btn.innerHTML = '✔ Berhasil';

      setTimeout(() => {

        window.location.href = "dashboard-pembeli.html";

      },1200);

    }

    function goLogin(){

      window.location.href = "login-pembeli.html";

    }

  </script>

</body>
</html>
